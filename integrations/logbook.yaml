# https://www.home-assistant.io/integrations/logbook/
# stupid filters don't work with recorder, because reasons?
# https://community.home-assistant.io/t/excluded-entity-still-shows-up-in-logbook/598702
# https://community.home-assistant.io/t/logbook-exclude-dont-work/438073
# https://github.com/home-assistant/core/issues/73058
# https://github.com/home-assistant/core/issues/80716
logbook:
  exclude:
    domains:
      - sensor
    entity_globs:
      - binary_sensor.*_motion_presence
      - sensor.dreamevac_*
      - select.dreamevac_*
      - switch.dreamevac_*
      - switch.*_curtain_*
      - switch.*_sheer_*
      - switch.*_motion_find_*
