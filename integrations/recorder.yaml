# https://www.home-assistant.io/integrations/recorder/
recorder:
  db_url: !secret mariadb_url
  # purge_keep_days: 14 # default 10
  include:
    domains:
      - alarm_control_panel
      - automation
      - binary_sensor
      - climate
      - cover
      - device_tracker
      - group
      - input_boolean
      - input_datetime
      - input_select
      - input_text
      - light
      - lock
      - person
      - switch
      - vacuum
      - zone
    entity_globs:
      - sensor.*_geocoded_location
      - sensor.*_humidity
      - sensor.*_illuminance
      - sensor.*_temperature
      - sensor.*_last_electricity_reading
  exclude:
    entity_globs:
      - automation.location*
      - automation.media*
      - automation.switch*
      - automation.tv*
      - binary_sensor.*_ping
      - sensor.*_battery*
      - sensor.*_energy
      - sensor.*_illuminance_lux
      - sensor.*_kib_s
      - sensor.*_linkquality
      - sensor.*_motion_sensor_temperature
      - sensor.*_packets_*
      - sensor.*_rssi
      - sensor.*_uptime
      - sensor.*_wifi_signal
